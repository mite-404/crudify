name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Publish the current package.json version and create its tag and GitHub Release
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 20.x
          - 22.x
          - 24.x
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  release:
    name: Release
    needs: test
    if: github.ref == 'refs/heads/main' && (inputs.bootstrap || vars.RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish current version (bootstrap)
        if: ${{ inputs.bootstrap }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$VERSION" version --json 2>/dev/null | tr -d '[:space:]"' || true)
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            npm publish --access public
          fi

      - name: Repair missing npm publish for an existing tag
        if: ${{ !inputs.bootstrap }}
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$VERSION" version --json 2>/dev/null | tr -d '[:space:]"' || true)
            if [ "$PUBLISHED_VERSION" != "$VERSION" ]; then
              echo "Tag v$VERSION exists but $PACKAGE_NAME@$VERSION is not on npm; publishing tagged source"
              TMP_DIR=$(mktemp -d)
              trap 'git worktree remove --force "$TMP_DIR/worktree" 2>/dev/null || true; rm -rf "$TMP_DIR"' EXIT
              git worktree add --detach "$TMP_DIR/worktree" "v$VERSION"
              (cd "$TMP_DIR/worktree" && npm ci && npm publish --access public)
            else
              echo "$PACKAGE_NAME@$VERSION is already published"
            fi
          else
            echo "Tag v$VERSION does not exist; semantic-release will handle the release"
          fi

      - name: Create tag and GitHub Release (bootstrap)
        if: ${{ inputs.bootstrap }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes "See CHANGELOG.md for details."
          fi

      - name: Release
        if: ${{ !inputs.bootstrap }}
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Ensure released version is published to npm
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$VERSION" version --json 2>/dev/null | tr -d '[:space:]"' || true)
          if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
            echo "$PACKAGE_NAME@$VERSION is already published"
          else
            echo "Publishing $PACKAGE_NAME@$VERSION"
            npm publish --access public
          fi
